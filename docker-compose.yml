

services:
  web:
    build: .
    container_name: hub
    command: foreman start -f Procfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - builds:/app/app/assets/builds
    environment:
      RAILS_ENV: development
      PORT: 3000
      BINDING: 0.0.0.0
    tty: true
    stdin_open: true

volumes:
  node_modules:
  builds:
